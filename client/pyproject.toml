[project]
name = "burnscope-client"
version = "0.1.0"
description = "BurnScope daemon: tails Claude Code sessions and pushes usage snapshots to an ESP32 display."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "watchdog>=4",
  "zeroconf>=0.130",
]

[project.scripts]
burnscope-client = "burnscope_client.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burnscope_client"]
